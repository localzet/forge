name: Isolated GitHub Actions Runner #4723 validation

on:
  push:
    branches:
      - ci/runner-4723-validation
    paths:
      - .github/ci/runner-4723-apply.py
      - .github/workflows/runner-4723-validation.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch pinned upstream and apply proposed fix
        shell: bash
        run: |
          set -euo pipefail
          git init runner
          git -C runner remote add origin https://github.com/actions/runner.git
          git -C runner fetch --depth=1 origin cf65f3ec8100ee0046d735ac5d647e00f4b8e817
          git -C runner checkout --detach FETCH_HEAD
          python3 .github/ci/runner-4723-apply.py runner
          git -C runner diff --check
          git -C runner status --short
          git -C runner diff --stat

      - name: Compile and run focused xUnit tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet test runner/src/Test/Test.csproj \
            --filter 'FullyQualifiedName~WorkflowPermissionsL0' \
            --logger 'console;verbosity=normal' \
            --verbosity minimal

      - name: Run complete Runner xUnit test suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet test runner/src/Test/Test.csproj --no-restore \
            --logger 'console;verbosity=minimal' \
            --verbosity minimal
